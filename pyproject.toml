[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-dash"
dynamic = ["version"]
description = "Dashboard en vivo, en la terminal, de las sesiones de Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
cc-dash = "cc_dash:main"

[tool.setuptools]
py-modules = ["cc_dash"]

[tool.setuptools.dynamic]
version = { attr = "cc_dash.__version__" }
